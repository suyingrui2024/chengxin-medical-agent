  <title id="title">主观症状部位：正面与背面</title>
  <desc id="desc">正面与背面分别显示头面、胸部、腹部、四肢及背腰的大范围。左右按患者自身标注。虚线仅作区域示意，不代表精确位置、测量或疾病，不需要按压身体。</desc>
