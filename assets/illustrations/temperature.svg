<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">数字体温计腋温测量：三步示意</title>
  <desc id="desc">先阅读设备说明并擦干腋窝，将探头放在腋窝中央，手臂贴紧身体，依设备说明等待测量完成。本图是原型示意，不能核验实际动作。</desc>
  <view id="step-1" viewBox="55 26 245 296" />
  <view id="step-2" viewBox="375 26 245 296" />
  <view id="step-3" viewBox="695 26 245 296" />
  <defs>
    <g id="person" fill="#80a895">
      <circle cx="176" cy="80" r="25" />
      <path d="M151 127h50q19 0 19 23v136q0 15-15 15h-58q-15 0-15-15V150q0-23 19-23Z" />
    </g>
    <path id="raised-arm" d="m143 147-41-28 13-47" fill="none" stroke="#80a895" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
    <g id="thermometer" stroke="#346d60" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="-8" width="53" height="16" rx="8" fill="#fffefd" stroke-width="2" />
      <rect x="10" y="-4" width="22" height="8" rx="2" fill="#c4dcd1" stroke="none" />
      <path d="M53 0h31" stroke-width="5" />
    </g>
    <g id="step-number">
      <circle cx="40" cy="38" r="12" fill="#d6e6bd" />
    </g>
    <path id="wiping-arm" d="m208 148 19 67-85-48" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path id="holding-arm" d="m208 148 19 67-110-6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <path id="closed-arm" d="m141 148-1 78 44 23" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </defs>
  <rect width="960" height="420" fill="#eff4ec" />
  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#234e3b" text-anchor="middle">
    <g>
      <use href="#step-number" />
      <text x="40" y="44" font-size="17" font-weight="700">1</text>
      <use href="#person" />
      <use href="#raised-arm" />
      <use href="#wiping-arm" stroke="#eff4ec" stroke-width="31" />
      <use href="#wiping-arm" stroke="#80a895" stroke-width="25" />
      <path d="m118 145 25-9 16 26-26 12Z" fill="#fffefd" stroke="#739582" stroke-width="2" stroke-linejoin="round" />
      <path d="m125 149 14-5m-9 14 13-5" fill="none" stroke="#c9d9cd" stroke-width="2" stroke-linecap="round" />
      <text x="160" y="359" font-size="22" font-weight="600">先擦干腋窝</text>
      <text x="160" y="389" font-size="13" fill="#60775f">先阅读体温计说明书</text>
    </g>
    <g transform="translate(320)">
      <use href="#step-number" />
      <text x="40" y="44" font-size="17" font-weight="700">2</text>
      <use href="#person" />
      <path d="m143 148-27 64" fill="none" stroke="#80a895" stroke-width="25" stroke-linecap="round" stroke-linejoin="round" />
      <use href="#holding-arm" stroke="#eff4ec" stroke-width="31" />
      <use href="#holding-arm" stroke="#80a895" stroke-width="25" />
      <circle cx="137" cy="167" r="17" fill="#e5edcf" stroke="#6b9476" stroke-width="1.6" stroke-dasharray="3 4" />
      <use href="#thermometer" transform="translate(83 203) rotate(-34) scale(.78)" />
      <circle cx="137" cy="167" r="3" fill="#346d60" />
      <path d="M159 163h58" fill="none" stroke="#739180" stroke-width="1.3" />
      <text x="246" y="167" font-size="13">腋窝中央</text>
      <text x="160" y="359" font-size="22" font-weight="600">探头贴在腋窝中央</text>
      <text x="160" y="389" font-size="13" fill="#60775f">位置示意，不代表动作已正确</text>
    </g>
    <g transform="translate(640)">
      <use href="#step-number" />
      <text x="40" y="44" font-size="17" font-weight="700">3</text>
      <use href="#person" />
      <path d="m208 148 8 89" fill="none" stroke="#80a895" stroke-width="25" stroke-linecap="round" />
      <use href="#thermometer" transform="translate(98 190) rotate(-28) scale(.55)" />
      <use href="#closed-arm" stroke="#eff4ec" stroke-width="31" />
