<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">数字体温计腋温测量：三步示意</title>
  <desc id="desc">先阅读设备说明并擦干腋窝，将探头放在腋窝中央，手臂贴紧身体，依设备说明等待测量完成。本图是原型示意，不能核验实际动作。</desc>
  <view id="step-1" viewBox="0 52 320 278"/>
  <view id="step-2" viewBox="320 52 320 278"/>
  <view id="step-3" viewBox="640 52 320 278"/>
  <defs>
