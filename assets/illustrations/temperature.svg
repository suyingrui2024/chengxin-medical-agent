    <g id="step-number"><circle cx="40" cy="38" r="12" fill="#d6e6bd"/></g>
  </defs>
  <rect width="960" height="420" fill="#eff4ec"/>
  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#234e3b" text-anchor="middle">
