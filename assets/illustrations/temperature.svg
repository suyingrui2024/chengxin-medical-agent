      <path d="M104 235h15m-5-5 5 5-5 5" fill="none" stroke="#477c68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="259" cy="78" r="20" fill="#fffefd" stroke="#adc4b4" stroke-width="1.5" />
      <path d="M259 66v13l8 5" fill="none" stroke="#477c68" stroke-width="2" stroke-linecap="round" />
      <text x="160" y="359" font-size="22" font-weight="600">夹紧手臂，等测量完成</text>
      <text x="160" y="389" font-size="13" fill="#60775f">等待时长以设备说明为准</text>
    </g>
  </g>
</svg>
