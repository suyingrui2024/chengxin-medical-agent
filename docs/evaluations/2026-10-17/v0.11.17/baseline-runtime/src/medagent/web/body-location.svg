  <use href="#person" transform="translate(235)"/>
  <use href="#person" transform="translate(505)"/>
  <g fill="#d9ed99" stroke="#17685b" stroke-width="2"><ellipse cx="235" cy="70" rx="22" ry="25"/><rect x="212" y="137" width="46" height="45" rx="8"/><rect x="212" y="189" width="46" height="48" rx="8"/><rect x="482" y="140" width="46" height="98" rx="8"/></g>
  <g fill="none" stroke="#17685b" stroke-width="2"><path d="M100 70h110M100 160h110M100 213h110M303 295h35M530 187h92"/></g>
  <g font-family="Arial,'PingFang SC',sans-serif" font-size="19" fill="#18312d"><text x="24" y="77">头/面部</text><text x="24" y="167">胸部</text><text x="24" y="220">腹部</text><text x="320" y="289">四肢</text><text x="627" y="194">背/腰</text><text x="215" y="410" font-size="16">正面</text><text x="485" y="410" font-size="16">背面</text></g>
</svg>
