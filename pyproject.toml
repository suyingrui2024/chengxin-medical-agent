[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "medagent"
version = "0.11.17"
description = "Auditable outpatient-style consultation agent prototype"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "medical-agent contributors" }]

[project.scripts]
medagent = "medagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medagent = ["content/*.json", "content/*.txt"]
"medagent.web" = ["index.html", "js/*.js", "js/**/*.js", "css/*.css", "css/**/*.css", "assets/**/*"]
"medagent.extensions" = ["packs/*.json", "templates/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Frozen evaluation snapshots are evidence, not code under review: they keep
# the sources they were run against, broken imports and all.
extend-exclude = ["docs/evaluations", "docs/review-packets", ".runtime", "node_modules"]

[tool.ruff.lint]
# Deliberately only the rules that mean the code is *broken* or *dead*, not
# merely untidy: syntax errors, broken `__all__`, invalid `assert`, undefined
# names, unused imports and variables, plus two bugbear checks whose hits are
# all genuine.
#
# F401/F403/F405 only became possible once the star imports went. 46 modules
# began with `from ._preamble import *`, which makes "unused import" and
# "possibly undefined" meaningless: every name might come from anywhere. There
# are none left: 38 import what they use, and the 8 package facades import an
# explicit list and declare it in `__all__`, so no `# noqa` is needed for a
# star import anywhere in the tree.
#
# Turning F401 on then found 467 unused imports: 252 in the packages that had
# been split out of one module (each submodule kept the original file's whole
# import block) and 38 in tests. All removed. Nine were not dead but
# re-exports, and those got a real fix: the consumers now import from the
# module that defines the name, instead of through two hops
# (`reasoning -> assets -> sheet -> consumer`). Five fact tables in
# `conclusion/constants.py` are re-exported on purpose -- the comment above
# them says why -- so that module declares a 35-name `__all__` instead.
#
# Bugbear is on as a whole set: `--select B` is clean everywhere except B023,
# which is handled per-file below. B905 (`zip` without `strict=`) was 7 sites
# and each turned out to be a place where the two sides are equal by
# construction -- an explicit length check, or a list built from the other --
# so all seven now say `strict=True` and a future mismatch raises instead of
# silently dropping the tail. One of them was not merely stylistic:
# `consultation_subject.compatible` compared a 3-slot reference against a
# 2-slot one by their shared prefix, so a truncated profile read as compatible.
select = [
    "B",     # bugbear: the whole set, minus the B023 exception below
    "E9",    # syntax errors
    "F401",  # unused import
    "F403",  # star import
    "F405",  # name that may be undefined because of a star import
    "F541",  # f-string without placeholders
    "F63",   # invalid `__all__`, assert misuse, ...
    "F7",    # real statements that do nothing
    "F811",  # redefinition
    "F82",   # undefined name
    "F841",  # unused local variable
]

[tool.ruff.lint.per-file-ignores]
# B023 flags a `def` or `class` created inside a loop that reads a loop
# variable. It cannot tell whether the closure escapes the iteration, and in
# these two trees it never does: the fixtures build one fake backend per case
# and hand it to the engine before the loop advances (73 hits in tests, 6 in
# scripted evaluation). Production code has none of these, so the rule stays on
# exactly where a late-bound closure would be a real defect.
"tests/**" = ["B023"]
"scripts/evaluation/**" = ["B023"]

[tool.coverage.run]
source = ["src/medagent"]
branch = true
# Coverage measures one platform at a time, and two modules are almost entirely
# the *other* platform:
#
#   * `infra/windows_process.py` cannot even be imported on POSIX (it calls
#     `ctypes.WinDLL` at module scope), so omitting it keeps a POSIX run from
#     reporting a file it can never touch;
#   * `infra/platform_fs.py` is a three-line re-export on POSIX and a 355-line
#     ctypes Win32 implementation otherwise, so its POSIX number is structural,
#     not a gap. It stays in the count (the POSIX branch is real code) but do
#     not read its percentage as coverage of the module.
#
# Both are exercised by the Windows job:
# `scripts/platform/windows/windows.ps1 -Mode Test` and `-Mode ExecutionTest`
# run `tests/test_windows_native.py` and `tests/test_windows_execution.py`.
omit = ["src/medagent/infra/windows_process.py"]

[tool.coverage.report]
# A partial branch is more interesting than a missing line: the line ran, but
# one side of a decision never did.
skip_covered = false
show_missing = true

