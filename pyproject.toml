[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "medagent"
version = "0.11.17"
description = "Auditable outpatient-style consultation agent prototype"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "medical-agent contributors" }]

[project.scripts]
medagent = "medagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medagent = ["web/*", "content/*.json", "content/*.txt"]
"medagent.extensions" = ["packs/*.json", "templates/*.json"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Frozen evaluation snapshots are evidence, not code under review: they keep
# the sources they were run against, broken imports and all.
extend-exclude = ["docs/evaluations", "docs/review-packets", ".runtime", "node_modules"]

[tool.ruff.lint]
# Deliberately only the rules that mean the code is *broken*, not merely
# untidy: syntax errors, broken `__all__`, invalid `assert`, undefined names,
# plus two bugbear checks whose hits are all genuine.
#
# The usual Python lint sets cannot be enabled as-is here. 32 modules start
# with `from ._preamble import *`, so F401 (unused import) and F403 (star
# import) fire on every one of them, and F821 is the only unused-name check
# that still means something. Bugbear's B023 alone adds 79 hits from closures
# created inside loops that are invoked immediately, and every B905 (`zip`
# without `strict=`) site needs a per-site decision about which length is
# allowed to be shorter — neither may be enabled blind.
#
# B904 (raise without `from` inside `except`) and B007 (loop variable never
# used) are on because both were clean after fixing their few real hits.
select = ["E9", "F63", "F7", "F82", "B904", "B007"]

[tool.coverage.run]
source = ["src/medagent"]
branch = true
# Coverage measures one platform at a time, and two modules are almost entirely
# the *other* platform:
#
#   * `infra/windows_process.py` cannot even be imported on POSIX (it calls
#     `ctypes.WinDLL` at module scope), so omitting it keeps a POSIX run from
#     reporting a file it can never touch;
#   * `infra/platform_fs.py` is a three-line re-export on POSIX and a 355-line
#     ctypes Win32 implementation otherwise, so its POSIX number is structural,
#     not a gap. It stays in the count (the POSIX branch is real code) but do
#     not read its percentage as coverage of the module.
#
# Both are exercised by the Windows job:
# `scripts/platform/windows/windows.ps1 -Mode Test` and `-Mode ExecutionTest`
# run `tests/test_windows_native.py` and `tests/test_windows_execution.py`.
omit = ["src/medagent/infra/windows_process.py"]

[tool.coverage.report]
# A partial branch is more interesting than a missing line: the line ran, but
# one side of a decision never did.
skip_covered = false
show_missing = true

