# Overlay the pinned sdk-minimal profile. No model-facing host capabilities.
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: pty
  disabled: true
- id: subprocess
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-retry
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: 'You are the medical-agent decision transport. Follow the enclosed medical coordinator instructions. Return exactly one JSON tool proposal, never execute host commands.'
# SDK 0.2.1 added a filesystem surface to the sdk-minimal profile
# (fs-local, attachment-local, tool-fs, working-directory). The medical
# bridge contract is "no model-facing host capabilities" — disable the
# whole surface and restore the 0.2.0 capability posture.
- id: filesystem
  disabled: true
- id: attachment-local
  disabled: true
- id: tool-fs
  disabled: true
- id: working-directory
  disabled: true
- id: tool-working-directory
  disabled: true
