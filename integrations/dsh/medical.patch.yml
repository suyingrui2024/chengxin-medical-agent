# Overlay the pinned sdk-minimal profile. No model-facing host capabilities.
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: pty
  disabled: true
- id: subprocess
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: llm-retry
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: 'You are the medical-agent decision transport. Follow the enclosed medical coordinator instructions. Return exactly one JSON tool proposal, never execute host commands.'
# SDK 0.2.1 added filesystem and working-directory services plus the tools
# that expose them to the model. sdk-jsonrpc-server requires the internal
# workingDirectory service, and that service requires fs, so the two services
# must stay active for the SDK runtime to boot. Disable only the model-facing
# tools and attachment surface; the medical bridge still exposes no host tool.
- id: attachment-local
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-working-directory
  disabled: true
