name: Main patient safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-patient-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patient-safety:
    name: Patient contracts and reflow
    runs-on: ubuntu-24.04
    # The browser suite starts a fresh server per spec file (52 of them), so
    # it is the long pole: ~20 minutes locally, and CI runners are slower.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # Cheap, dependency-free guards against structural debt regrowing. Run
      # before the browser install so a regression fails fast. Size and coupling
      # are separate debts: one bounds how big a file may get, the other who is
      # allowed to import whom.
      - name: Enforce module-size ceiling
        run: python scripts/lint/module_size.py
      # A file can be within the 1200-line ceiling and still be unreadable,
      # because the cost is inside the functions. This one bounds 60 lines and
      # 20 branches per function and freezes today's 127 outliers at their
      # current size, so the number can only go down.
      - name: Enforce function-size ceiling
        run: python scripts/lint/function_size.py
      - name: Enforce import direction
        run: python scripts/lint/import_rules.py
      # A file can be the right size in the right layer and still be called
      # `utils`. Size and coupling do not notice a name that describes nothing.
      - name: Enforce file naming
        run: python scripts/lint/naming.py
      # The evidence snapshots already carry 481 MiB of wheels, tarballs and
      # fonts. That history is not being rewritten; this only refuses *new*
      # copies of the same bytes.
      - name: Enforce large-asset ceiling
        run: python scripts/lint/asset_size.py
      # The version is declared once, in src/medagent/_version.py. Two manifest
      # files and the policy version stamped into every audit record have to
      # agree with it: a stale policy_version says the clinical policy in force
      # was a different one from the code that ran.
      - name: Enforce one version
        run: python scripts/lint/version.py
      # A design document nobody can find is a design nobody reads. The index
      # lists every document with its status and last change, and this fails
      # when a document is missing from it.
      - name: Enforce the docs index
        run: python scripts/lint/docs_index.py --check
      # A function of 25 lines or more has to say what it guarantees, what
      # it touches and when not to call it. The baseline freezes today's
      # gaps: only the ones fixed can leave it.
      - name: Enforce function docstrings
        run: python scripts/lint/docstrings.py
      # Undefined names and broken annotations are cheap to catch and were the
      # one class of defect the suite could not: a skipped test hid a
      # `threading` that was never imported.
      - name: Enforce Python lint baseline
        run: |
          python -m pip install --quiet ruff
          python -m ruff check src tests scripts
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node -e "console.log('CHROME_BIN=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      # The frontend unit tests exist but nothing ran them: three files under
      # tests/unit/ were checked by nobody, and a contract mismatch between
      # the server's illustration rule and the browser's went unnoticed until
      # a task card failed to render in fourteen browser tests.
      - name: Run the frontend unit tests
        run: npm run test:unit
      - name: Run the full Python suite and the release gate
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
          python scripts/evaluation/medical/evaluate_release_gate.py
      # The three-spec smoke that used to sit here (p0-summary-status,
      # patient-reflow, self-check-visuals) is gone: the whole suite below
      # covers it, and a second entry point only creates a second place to
      # keep in step.
      #
      # Running a hand-picked list is how sixteen appearance tests stayed
      # red for five days: they were never in the workflow. The browser
      # suite runs whole, the same way the Python step runs the whole suite.
      #
      # It used to run in this job too, but it is the long pole of the
      # pipeline -- one server per spec file -- so it moved to its own job
      # below, split into four shards, and this job no longer has to fit it
      # in the same timeout. It is still a hard gate: two things had to change
      # first, the scripted models obeying the engine's machine-readable
      # feedback (so a rejected proposal no longer desyncs the whole script)
      # and `test:ui:ci` running one spec file per server. With those, all 52
      # spec files pass on a clean checkout, so a failure there is a real
      # failure.
      - name: Check interface formatting (same list as local format:check)
        run: npm run format:check

  # The browser suite starts a fresh server per spec file, which makes it the
  # long pole of the whole pipeline: on one runner it is most of the job, and
  # the patient-safety job above has to fit it in the same timeout. Four
  # shards on four runners finish in the time one shard took before.
  #
  # Sharding is by file index, round robin, so the shards carry comparable
  # cost. Each shard gets its own port and its own output directory: the
  # suite wipes its output directory between files, so two shards sharing one
  # would spend their time deleting each other's artefacts.
  browser-suite:
    name: Browser suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Run the browser suite
        env:
          UI_SHARD: ${{ matrix.shard }}/4
          UI_PORT: 18766
          UI_OUTPUT_DIR: test-results/ui-${{ matrix.shard }}
        run: npm run test:ui:ci
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ matrix.shard }}
          path: test-results/ui-${{ matrix.shard }}
          retention-days: 7
          if-no-files-found: ignore

  # macOS is the development machine and has no packaging story, so it gets
  # a smoke rather than the full pipeline: the Python suite, the frontend
  # unit tests, every structural guard, and one browser spec file.  The
  # browser suite's logic is platform-independent; what the macOS job is for
  # is catching "works on the dev machine only" assumptions in the Python
  # and Node layers.
  macos-smoke:
    name: macOS smoke (dev platform)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - name: Install dependencies
        run: |
          python -m pip install --quiet pytest ruff
          npm ci --ignore-scripts
          npx playwright install chromium
      - name: Structural guards
        run: |
          python scripts/lint/module_size.py
          python scripts/lint/function_size.py
          python scripts/lint/import_rules.py
          python scripts/lint/naming.py
          python scripts/lint/asset_size.py
          python scripts/lint/version.py
          python scripts/lint/docs_index.py --check
          python scripts/lint/docstrings.py
          python -m ruff check src tests scripts
      - name: Python suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q
      - name: Frontend unit tests
        run: npm run test:unit
      - name: Browser smoke (one spec file, fresh server)
        env:
          UI_PORT: 18766
          UI_OUTPUT_DIR: test-results/ui-smoke
        run: npx playwright test --config playwright.ci.config.mjs --reporter=line workspace
