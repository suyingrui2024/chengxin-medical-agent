name: Main patient safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-patient-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patient-safety:
    name: Patient contracts and reflow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node -e "console.log('CHROME_BIN=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run the full Python suite and the release gate
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
          python scripts/evaluation/medical/evaluate_release_gate.py
      - name: Verify patient emergency actions, self-check guidance and 400 percent reflow equivalent
        run: node node_modules/@playwright/test/cli.js test tests/ui/p0-summary-status.spec.mjs tests/ui/patient-reflow.spec.mjs tests/ui/self-check-visuals.spec.mjs
      - name: Check interface formatting (same list as local format:check)
        run: npm run format:check
