name: Main patient safety
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: main-patient-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  patient-safety:
    name: Patient contracts and reflow
    runs-on: ubuntu-24.04
    # The browser suite starts a fresh server per spec file (52 of them), so
    # it is the long pole: ~20 minutes locally, and CI runners are slower.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # Cheap, dependency-free guards against structural debt regrowing. Run
      # before the browser install so a regression fails fast. Size and coupling
      # are separate debts: one bounds how big a file may get, the other who is
      # allowed to import whom.
      - name: Enforce module-size ceiling
        run: python scripts/lint/module_size.py
      - name: Enforce import direction
        run: python scripts/lint/import_rules.py
      # The evidence snapshots already carry 481 MiB of wheels, tarballs and
      # fonts. That history is not being rewritten; this only refuses *new*
      # copies of the same bytes.
      - name: Enforce large-asset ceiling
        run: python scripts/lint/asset_size.py
      # Undefined names and broken annotations are cheap to catch and were the
      # one class of defect the suite could not: a skipped test hid a
      # `threading` that was never imported.
      - name: Enforce Python lint baseline
        run: |
          python -m pip install --quiet ruff
          python -m ruff check src tests scripts
      - name: Install locked browser test dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          node -e "console.log('CHROME_BIN=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Run the full Python suite and the release gate
        env:
          PYTHONPATH: src
        run: |
          python -m pip install --quiet pytest
          python -m pytest tests -q
          python scripts/evaluation/medical/evaluate_release_gate.py
      # The three-spec smoke that used to sit here (p0-summary-status,
      # patient-reflow, self-check-visuals) is gone: the whole suite below
      # covers it, and a second entry point only creates a second place to
      # keep in step.
      #
      # Running a hand-picked list is how sixteen appearance tests stayed
      # red for five days: they were never in the workflow. The browser
      # suite now runs whole, the same way the Python step runs the whole
      # suite.
      #
      # It is a hard gate now. Two things had to change first: the scripted
      # models obey the engine's machine-readable feedback (so a rejected
      # proposal no longer desyncs the whole script), and `test:ui:ci` runs
      # one spec file per server — sharing a single server meant each file
      # inherited the previous one's patient record and the red set moved
      # with file order. With those, all 52 spec files pass on a clean
      # checkout, so a failure here is a real failure.
      - name: Run the whole browser suite
        run: npm run test:ui:ci
      - name: Check interface formatting (same list as local format:check)
        run: npm run format:check
      # A failing spec is worth nothing without its trace: the screenshots and
      # trace files are the only record of what the browser actually saw, and
      # `retain-on-failure` writes them only for the cases that failed. Kept a
      # week — long enough to investigate, short enough not to accumulate.
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure
          path: test-results/ui
          retention-days: 7
          if-no-files-found: ignore
