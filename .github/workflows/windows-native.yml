name: Native Windows desktop
on:
  workflow_dispatch:
    inputs:
      deadline_diagnostic:
        description: Run only the source deadline investigation; not full Windows acceptance
        type: boolean
        default: false
  push:
    branches: [windows-native]
permissions:
  contents: read
jobs:
  deadline-diagnostic:
    if: ${{ inputs.deadline_diagnostic }}
    name: Windows 11 command deadline investigation (source only)
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Restore verified native dependencies
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .runtime/windows
            node_modules
          key: native-windows-v1-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/windows/runtime-lock.json', 'scripts/windows.ps1') }}
      - name: Verify native runtimes and real desktop
        shell: powershell
        run: |
          if ('${{ steps.runtime-cache.outputs.cache-hit }}' -eq 'true') {
            ./scripts/windows.ps1 -Mode Check
          } else {
            ./scripts/windows.ps1 -Mode Setup -NoShortcut
          }
      - name: Investigate original and independent command deadlines
        shell: powershell
        run: |
          $env:PATH = (Join-Path $PWD '.runtime/windows/node') + ';' + $env:PATH
          $env:PYTHONPATH = Join-Path $PWD 'src'
          & ./.runtime/windows/node/node.exe scripts/windows/isolation-check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./.runtime/windows/python/python.exe -m unittest tests.test_windows_execution.WindowsExecutionTests.test_original_command_deadline_survives_an_independent_followup -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows:
    if: ${{ !inputs.deadline_diagnostic }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            name: Windows Server x64 desktop
            execution: false
            artifact: Windows-x64
          - runner: windows-11-arm
            name: Windows 11 on Arm running x64 application
            execution: true
            artifact: Windows11-x64-compat
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          sparse-checkout: |
            src
            desktop
            integrations
            scripts
            tests
      - name: Restore verified native dependencies
        id: runtime-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .runtime/windows
            node_modules
          key: native-windows-v1-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/windows/runtime-lock.json', 'scripts/windows.ps1') }}
      - name: Install native runtimes and exercise real desktop
        shell: powershell
        run: |
          if ('${{ steps.runtime-cache.outputs.cache-hit }}' -eq 'true') {
            ./scripts/windows.ps1 -Mode Check
          } else {
            ./scripts/windows.ps1 -Mode Setup -NoShortcut
          }
      - name: Save verified native dependencies
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .runtime/windows
            node_modules
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Win32 filesystem, locks and process trees
        shell: powershell
        run: ./scripts/windows.ps1 -Mode Test
      - name: Path boundaries, delivery evidence and preview data
        shell: powershell
        run: |
          & ./.runtime/windows/node/node.exe --test integrations/dsh/tests/windows-path-broker.test.mjs integrations/dsh/tests/execution-inputs.test.mjs integrations/dsh/tests/execution-delivery.test.mjs integrations/dsh/tests/execution-checkpoints.test.mjs integrations/dsh/tests/execution-observations.test.mjs integrations/dsh/tests/gateway-stream.test.mjs integrations/dsh/tests/execution-deadline.test.mjs integrations/dsh/tests/execution-ownership.test.mjs integrations/dsh/tests/execution-search.test.mjs integrations/dsh/tests/execution-clarifications.test.mjs tests/unit/artifact-chart.test.mjs tests/unit/clipboard-permission.test.mjs tests/unit/execution-inputs-ui.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = Join-Path (Get-Location) 'src'
          & ./.runtime/windows/python/python.exe -m unittest tests.test_execution_observations.ObservationContractTests tests.test_execution_checkpoints tests.test_execution_persistence.WorkspaceIndexTests.test_stopped_turn_explanation_survives_offline_reopen_without_execution tests.test_execution_clarifications.ClarificationRecordTests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows isolation and full SDK execution
        if: matrix.execution
        shell: powershell
        run: ./scripts/windows.ps1 -Mode ExecutionTest
      - name: Native isolation host diagnostics
        if: always()
        shell: powershell
        run: |
          Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' | Select-Object ProductName,DisplayVersion,CurrentBuild,UBR
          if (Test-Path .runtime/windows/isolation/wxc-exec.exe) {
            & ./.runtime/windows/isolation/wxc-exec.exe --probe
          }
      - name: Build Windows desktop with bundled Python and Node
        shell: powershell
        run: ./scripts/windows.ps1 -Mode Build
      - name: Run packaged Windows executable
        shell: powershell
        run: |
          $metadata = Get-Content package.json -Raw | ConvertFrom-Json
          $env:MEDAGENT_DESKTOP_BINARY = Join-Path $PWD "dist/desktop/Chengxin-$($metadata.version)-win32-x64/Chengxin.exe"
          $env:MEDAGENT_PYTHON = $null
          & ./.runtime/windows/node/node.exe scripts/windows/gui-check.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and verify native Windows installer
        if: ${{ !matrix.execution }}
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $compilerSetup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $compilerSetup
          if ((Get-FileHash $compilerSetup -Algorithm SHA256).Hash.ToLowerInvariant() -ne '0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f') { throw 'Inno Setup checksum mismatch' }
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'Chengxin Inno 7'
          $setup = Start-Process -FilePath $compilerSetup -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=', ('/DIR="' + $compilerRoot + '"')) -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw 'Inno Setup compiler installation failed' }
          $env:MEDAGENT_ISCC = Join-Path $compilerRoot 'ISCC.exe'
          ./scripts/windows.ps1 -Mode Installer
          ./tests/windows-installer-e2e.ps1
      - name: Execute full SDK with packaged Python and Node
        if: matrix.execution
        shell: powershell
        run: |
          $metadata = Get-Content package.json -Raw | ConvertFrom-Json
          ./scripts/windows/packaged-execution-check.ps1 -ApplicationDirectory "dist/desktop/Chengxin-$($metadata.version)-win32-x64" -PathWithSpaces
      - name: Archive portable native Windows application
        shell: powershell
        run: |
          $metadata = Get-Content package.json -Raw | ConvertFrom-Json
          tar.exe -a -c -f dist/Chengxin-Windows-x64.zip -C "dist/desktop/Chengxin-$($metadata.version)-win32-x64" .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Chengxin-${{ matrix.artifact }}
          path: dist/Chengxin-Windows-x64.zip
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !matrix.execution }}
        with:
          name: Chengxin-Setup-Windows-x64
          path: dist/windows/*.exe
          retention-days: 3
