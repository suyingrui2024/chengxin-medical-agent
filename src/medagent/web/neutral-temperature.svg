<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">数字体温计腋温测量：分步示意</title>
  <desc id="desc">三幅带标注的示意图依次表示：抬起手臂、擦干腋窝；将探头放在腋窝中央、手臂夹紧；等待测量完成、读数并记录时间。图示不用于判断动作是否正确。</desc>
  <view id="step-1" viewBox="0 0 320 360" />
  <view id="step-2" viewBox="320 0 320 360" />
  <view id="step-3" viewBox="640 0 320 360" />
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7faf5" />
      <stop offset="1" stop-color="#edf4ed" />
    </linearGradient>
    <g id="thermometer" fill="none" stroke="#2f6c59" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="-13" width="70" height="26" rx="13" fill="#fff" stroke-width="4" />
      <rect x="15" y="-6" width="27" height="12" rx="3" fill="#cde2d5" stroke="none" />
      <path d="M70 0h35" stroke-width="7" />
    </g>
    <!-- 上身（腰线以上）：头:肩:躯干按约 1 : 2.7 : 2.2 的示意比例 -->
    <g id="torso">
      <path d="M117 78 L139 78 L139 100 L117 100 Z" fill="#e9f1ea" />
      <path
        d="M117 88 C88 92 62 100 54 118 C48 132 50 170 54 205 L58 252 L198 252 L202 205 C206 170 208 132 202 118 C194 100 168 92 139 88 Z"
        fill="#e9f1ea"
        stroke="#4d7465"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <circle cx="128" cy="54" r="29" fill="#e9f1ea" stroke="#4d7465" stroke-width="5" />
    </g>
    <g id="spot">
      <circle r="15" fill="#dfeecf" stroke="#4b8069" stroke-width="2.5" stroke-dasharray="4 5" />
      <circle r="4.5" fill="#2f6c59" />
    </g>
  </defs>
  <rect width="960" height="360" fill="#f3f7f1" />
  <g aria-label="抬起手臂，擦干腋窝" transform="translate(18 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <use href="#torso" />
    <!-- 右臂自然下垂 -->
    <path d="M198 112 L214 176 L208 230" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M198 112 L214 176 L208 230" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="208" cy="238" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 左臂抬起，露出腋窝 -->
    <path d="M60 110 C42 84 34 56 44 26" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" />
    <path d="M60 110 C42 84 34 56 44 26" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" />
    <circle cx="46" cy="19" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <use href="#spot" transform="translate(76 118)" />
    <!-- 擦汗的布 -->
    <g transform="rotate(-18 74 120)">
      <rect x="50" y="102" width="48" height="36" rx="9" fill="#fff" stroke="#4d7465" stroke-width="3.5" />
      <path d="M60 112h28M60 124h28" stroke="#96b9a7" stroke-width="3" stroke-linecap="round" />
    </g>
    <path d="M102 96 A24 24 0 0 1 105 132" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" />
    <path d="M97 123 L106 135 L116 124" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 标注 -->
    <text x="6" y="88" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">抬臂</text>
    <circle cx="102" cy="122" r="3" fill="#2f6c59" />
    <path d="M106 124 L144 130" stroke="#96b9a7" stroke-width="2" />
    <text x="148" y="135" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">擦干腋窝</text>
  </g>
  <g aria-label="探头放在腋窝中央，手臂夹紧" transform="translate(338 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <use href="#torso" />
    <!-- 右臂自然下垂 -->
    <path d="M198 112 L214 176 L208 230" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M198 112 L214 176 L208 230" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="208" cy="238" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 左臂放下夹紧 -->
    <path d="M60 110 L42 172 L48 228" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M60 110 L42 172 L48 228" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="49" cy="236" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 体温计画在手臂之上：探头越过手臂指向腋窝，表身自臂下伸出 -->
    <use href="#thermometer" transform="translate(-2 186) rotate(-42)" />
    <use href="#spot" transform="translate(76 116)" />
    <!-- 标注 -->
    <circle cx="94" cy="108" r="3" fill="#2f6c59" />
    <path d="M98 104 L144 96" stroke="#96b9a7" stroke-width="2" />
    <text x="148" y="101" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">探头居中</text>
    <circle cx="60" cy="232" r="3" fill="#2f6c59" />
    <path d="M64 236 L144 242" stroke="#96b9a7" stroke-width="2" />
    <text x="148" y="247" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">手臂夹紧</text>
  </g>
  <g aria-label="读数并记录时间" transform="translate(658 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <!-- 记录卡 -->
    <rect x="46" y="50" width="168" height="226" rx="16" fill="#fff" stroke="#4d7465" stroke-width="4" />
    <use href="#thermometer" transform="translate(70 92) scale(1.22)" />
    <circle cx="102" cy="182" r="17" fill="#fff" stroke="#4d7465" stroke-width="3.5" />
    <path d="M102 169v14l9 6" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M138 172h58M138 196h44" stroke="#96b9a7" stroke-width="6" stroke-linecap="round" />
    <path d="M72 232h104M72 250h76" stroke="#c9dcd2" stroke-width="6" stroke-linecap="round" />
    <!-- 标注 -->
    <circle cx="150" cy="92" r="3" fill="#2f6c59" />
    <path d="M154 94 L224 102" stroke="#96b9a7" stroke-width="2" />
    <text x="228" y="107" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">读数</text>
    <circle cx="121" cy="182" r="3" fill="#2f6c59" />
    <path d="M125 184 L224 188" stroke="#96b9a7" stroke-width="2" />
    <text x="228" y="193" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">记时间</text>
  </g>
</svg>
