<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">数字体温计腋温测量：分步示意</title>
  <desc id="desc">三幅带标注的示意图依次表示：抬起手臂、擦干腋窝；将探头放在腋窝中央、手臂夹紧；等待测量完成、读数并记录时间。图示不用于判断动作是否正确。</desc>
  <view id="step-1" viewBox="0 0 320 360" />
  <view id="step-2" viewBox="320 0 320 360" />
  <view id="step-3" viewBox="640 0 320 360" />
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7faf5" />
      <stop offset="1" stop-color="#edf4ed" />
    </linearGradient>
    <g id="thermometer" fill="none" stroke="#2f6c59" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="-13" width="70" height="26" rx="13" fill="#fff" stroke-width="4" />
      <rect x="15" y="-6" width="27" height="12" rx="3" fill="#cde2d5" stroke="none" />
      <path d="M70 0h35" stroke-width="7" />
    </g>
    <g id="torso">
      <path
        d="M119 66 C94 72 74 84 68 102 C64 116 66 150 68 190 L72 292 L184 292 L188 190 C190 150 192 116 188 102 C182 84 162 72 137 66 Z"
        fill="#e9f1ea"
        stroke="#4d7465"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <circle cx="128" cy="42" r="24" fill="#e9f1ea" stroke="#4d7465" stroke-width="5" />
    </g>
    <g id="spot">
      <circle r="15" fill="#dfeecf" stroke="#4b8069" stroke-width="2.5" stroke-dasharray="4 5" />
      <circle r="4.5" fill="#2f6c59" />
    </g>
  </defs>
  <rect width="960" height="360" fill="#f3f7f1" />
  <g aria-label="抬起手臂，擦干腋窝" transform="translate(18 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <use href="#torso" />
    <!-- 右臂自然下垂 -->
    <path d="M190 106 L207 176 L203 236" fill="none" stroke="#4d7465" stroke-width="16" stroke-linecap="round" />
    <path d="M190 106 L207 176 L203 236" fill="none" stroke="#e9f1ea" stroke-width="10" stroke-linecap="round" />
    <circle cx="203" cy="244" r="8" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 左臂抬起，露出腋窝 -->
    <path d="M70 108 C52 82 48 58 58 27" fill="none" stroke="#4d7465" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M70 108 C52 82 48 58 58 27" fill="none" stroke="#e9f1ea" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="59" cy="21" r="8" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <use href="#spot" transform="translate(88 120)" />
    <!-- 擦汗的布 -->
    <g transform="rotate(-18 92 126)">
      <rect x="68" y="108" width="48" height="36" rx="9" fill="#fff" stroke="#4d7465" stroke-width="3.5" />
      <path d="M78 118h28M78 130h28" stroke="#96b9a7" stroke-width="3" stroke-linecap="round" />
    </g>
    <path d="M128 100 A27 27 0 0 1 131 140" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" />
    <path d="M123 131 L132 143 L142 132" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 标注 -->
    <text x="8" y="102" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">抬臂</text>
    <circle cx="112" cy="122" r="3" fill="#2f6c59" />
    <path d="M116 124 L142 128" stroke="#96b9a7" stroke-width="2" />
    <text x="146" y="133" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">擦干腋窝</text>
  </g>
  <g aria-label="探头放在腋窝中央，手臂夹紧" transform="translate(338 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <use href="#torso" />
    <!-- 右臂自然下垂 -->
    <path d="M190 106 L207 176 L203 236" fill="none" stroke="#4d7465" stroke-width="16" stroke-linecap="round" />
    <path d="M190 106 L207 176 L203 236" fill="none" stroke="#e9f1ea" stroke-width="10" stroke-linecap="round" />
    <circle cx="203" cy="244" r="8" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 左臂放下夹紧 -->
    <path d="M70 108 L54 172 L60 234" fill="none" stroke="#4d7465" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M70 108 L54 172 L60 234" fill="none" stroke="#e9f1ea" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="61" cy="242" r="8" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 体温计画在手臂之上：探头越过手臂指向腋窝，表身自臂下伸出 -->
    <use href="#thermometer" transform="translate(3 183) rotate(-38)" />
    <use href="#spot" transform="translate(86 118)" />
    <!-- 标注 -->
    <circle cx="102" cy="110" r="3" fill="#2f6c59" />
    <path d="M106 106 L142 96" stroke="#96b9a7" stroke-width="2" />
    <text x="146" y="100" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">探头居中</text>
    <circle cx="70" cy="238" r="3" fill="#2f6c59" />
    <path d="M74 242 L142 250" stroke="#96b9a7" stroke-width="2" />
    <text x="146" y="255" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">手臂夹紧</text>
  </g>
  <g aria-label="读数并记录时间" transform="translate(658 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <!-- 记录卡 -->
    <rect x="46" y="50" width="168" height="226" rx="16" fill="#fff" stroke="#4d7465" stroke-width="4" />
    <use href="#thermometer" transform="translate(70 92) scale(1.22)" />
    <circle cx="102" cy="182" r="17" fill="#fff" stroke="#4d7465" stroke-width="3.5" />
    <path d="M102 169v14l9 6" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M138 172h58M138 196h44" stroke="#96b9a7" stroke-width="6" stroke-linecap="round" />
    <path d="M72 232h104M72 250h76" stroke="#c9dcd2" stroke-width="6" stroke-linecap="round" />
    <!-- 标注 -->
    <circle cx="150" cy="92" r="3" fill="#2f6c59" />
    <path d="M154 94 L224 102" stroke="#96b9a7" stroke-width="2" />
    <text x="228" y="107" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">读数</text>
    <circle cx="121" cy="182" r="3" fill="#2f6c59" />
    <path d="M125 184 L224 188" stroke="#96b9a7" stroke-width="2" />
    <text x="228" y="193" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">记时间</text>
  </g>
</svg>
