<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">数字体温计腋温测量：分步示意</title>
  <desc id="desc">三幅带标注的示意图依次表示：抬起手臂、擦干腋窝；将探头放在腋窝中央、手臂夹紧；等待测量完成、读数并记录时间。图示不用于判断动作是否正确。</desc>
  <view id="step-1" viewBox="0 0 320 360" />
  <view id="step-2" viewBox="320 0 320 360" />
  <view id="step-3" viewBox="640 0 320 360" />
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7faf5" />
      <stop offset="1" stop-color="#edf4ed" />
    </linearGradient>
    <g id="thermometer" fill="none" stroke="#2f6c59" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="-13" width="70" height="26" rx="13" fill="#fff" stroke-width="4" />
      <rect x="15" y="-6" width="27" height="12" rx="3" fill="#cde2d5" stroke="none" />
      <path d="M70 0h35" stroke-width="7" />
    </g>
    <!-- 上身（腰线以上）：肩宽约 2.4 头宽，肩到腰收分 -->
    <g id="torso">
      <path d="M119 76 L137 76 L137 98 L119 98 Z" fill="#e9f1ea" />
      <path
        d="M119 86 C94 90 74 98 66 116 C60 130 62 168 66 204 L70 250 L186 250 L190 204 C194 168 196 130 190 116 C182 98 162 90 137 86 Z"
        fill="#e9f1ea"
        stroke="#4d7465"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <circle cx="128" cy="54" r="27" fill="#e9f1ea" stroke="#4d7465" stroke-width="5" />
    </g>
    <g id="spot">
      <circle r="15" fill="#dfeecf" stroke="#4b8069" stroke-width="2.5" stroke-dasharray="4 5" />
      <circle r="4.5" fill="#2f6c59" />
    </g>
  </defs>
  <rect width="960" height="360" fill="#f3f7f1" />
  <g aria-label="抬起手臂，擦干腋窝" transform="translate(18 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <use href="#torso" />
    <!-- 右臂自然下垂 -->
    <path d="M188 110 L202 174 L196 226" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M188 110 L202 174 L196 226" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="196" cy="234" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 左臂抬起，露出腋窝 -->
    <path d="M68 108 C50 82 42 54 50 26" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" />
    <path d="M68 108 C50 82 42 54 50 26" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" />
    <circle cx="52" cy="19" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <use href="#spot" transform="translate(82 114)" />
    <!-- 擦汗的布 -->
    <g transform="rotate(-18 86 124)">
      <rect x="62" y="106" width="48" height="36" rx="9" fill="#fff" stroke="#4d7465" stroke-width="3.5" />
      <path d="M72 116h28M72 128h28" stroke="#96b9a7" stroke-width="3" stroke-linecap="round" />
    </g>
    <path d="M116 102 A20 20 0 0 1 119 130" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" />
    <path d="M111 122 L119 132 L128 122" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 标注 -->
    <text x="6" y="86" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">抬臂</text>
    <circle cx="110" cy="140" r="3" fill="#2f6c59" />
    <path d="M114 141 L146 143" stroke="#96b9a7" stroke-width="2" />
    <text x="150" y="148" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">擦干腋窝</text>
  </g>
  <g aria-label="探头放在腋窝中央，手臂夹紧" transform="translate(338 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <use href="#torso" />
    <!-- 右臂自然下垂 -->
    <path d="M188 110 L202 174 L196 226" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M188 110 L202 174 L196 226" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="196" cy="234" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 左臂放下夹紧 -->
    <path d="M68 108 L52 168 L58 224" fill="none" stroke="#4d7465" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M68 108 L52 168 L58 224" fill="none" stroke="#e9f1ea" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="59" cy="232" r="9" fill="#e9f1ea" stroke="#4d7465" stroke-width="4" />
    <!-- 体温计画在手臂之上：探头越过手臂指向腋窝，表身自臂下伸出 -->
    <use href="#thermometer" transform="translate(4 182) rotate(-42)" />
    <use href="#spot" transform="translate(82 112)" />
    <!-- 标注 -->
    <circle cx="98" cy="104" r="3" fill="#2f6c59" />
    <path d="M102 102 L146 94" stroke="#96b9a7" stroke-width="2" />
    <text x="150" y="99" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">探头居中</text>
    <circle cx="70" cy="228" r="3" fill="#2f6c59" />
    <path d="M74 232 L146 238" stroke="#96b9a7" stroke-width="2" />
    <text x="150" y="243" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">手臂夹紧</text>
  </g>
  <g aria-label="读数并记录时间" transform="translate(658 18)">
    <rect width="284" height="324" rx="30" fill="url(#panel)" />
    <!-- 记录卡 -->
    <rect x="46" y="50" width="168" height="226" rx="16" fill="#fff" stroke="#4d7465" stroke-width="4" />
    <use href="#thermometer" transform="translate(70 92) scale(1.22)" />
    <circle cx="102" cy="182" r="17" fill="#fff" stroke="#4d7465" stroke-width="3.5" />
    <path d="M102 169v14l9 6" fill="none" stroke="#2f6c59" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M138 172h58M138 196h44" stroke="#96b9a7" stroke-width="6" stroke-linecap="round" />
    <path d="M72 232h104M72 250h76" stroke="#c9dcd2" stroke-width="6" stroke-linecap="round" />
    <!-- 标注 -->
    <circle cx="150" cy="92" r="3" fill="#2f6c59" />
    <path d="M154 94 L224 102" stroke="#96b9a7" stroke-width="2" />
    <text x="228" y="107" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">读数</text>
    <circle cx="121" cy="182" r="3" fill="#2f6c59" />
    <path d="M125 184 L224 188" stroke="#96b9a7" stroke-width="2" />
    <text x="228" y="193" font-family="sans-serif" font-size="13" font-weight="600" fill="#2f5d4c">记时间</text>
  </g>
</svg>
